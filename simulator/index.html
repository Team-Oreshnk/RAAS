<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IIC 3.0 — Indian Road Simulator</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;font-family:Inter,system-ui,sans-serif;color:#fff}#hud{position:fixed;z-index:5;inset:14px 14px auto 14px;display:flex;justify-content:space-between;pointer-events:none}.panel{background:rgba(10,12,16,.82);border:1px solid #333;border-radius:12px;padding:12px 15px;backdrop-filter:blur(8px)}#status span{margin-right:14px}.ok{color:#6ee7b7}.warn{color:#fbbf24}.bad{color:#fb7185}#controls{position:fixed;z-index:5;left:14px;bottom:14px}.btn{pointer-events:auto;border:1px solid #444;background:#171a20;color:#fff;padding:8px 11px;border-radius:8px;margin:3px;cursor:pointer}.btn:hover{background:#242933}#decision{position:fixed;right:14px;bottom:14px;z-index:5;min-width:230px}.big{font-size:24px;font-weight:800;margin:5px 0}.small{font-size:12px;color:#aab0ba}.legend{font-size:12px;line-height:1.7}</style></head><body><div id="hud"><div class="panel"><b>IIC 3.0</b><div class="small">Adaptive Free-Space Driving Simulator</div></div><div class="panel" id="status"><span>SIM <b class="ok">● LIVE</b></span><span id="mode">MODE: AUTONOMOUS</span><span id="speed">0 km/h</span></div></div><div id="controls" class="panel"><button class="btn" onclick="setMode('auto')">AUTO</button><button class="btn" onclick="setMode('manual')">MANUAL</button><button class="btn" onclick="resetWorld()">RESET</button><button class="btn" onclick="eventScenario('motorcycle_cut_in')">MOTORCYCLE</button><button class="btn" onclick="eventScenario('pedestrian_emerge')">PEDESTRIAN</button><button class="btn" onclick="eventScenario('rolling_object')">ROLLING OBJECT</button><button class="btn" onclick="eventScenario('sudden_stop')">SUDDEN STOP</button></div><div id="decision" class="panel"><div class="small">PLANNER</div><div id="decisionText" class="big">FREE SPACE</div><div class="legend">Target speed: <b id="target">25</b> km/h<br>Risk: <b id="risk">0%</b><br>Objects: <b id="objects">0</b></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87a9c1);scene.fog=new THREE.Fog(0x87a9c1,180,500);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,900);camera.position.set(0,5.8,-12);camera.lookAt(0,1,28);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x52606d,2.6));const sun=new THREE.DirectionalLight(0xffffff,2.8);sun.position.set(-40,80,-30);sun.castShadow=true;scene.add(sun);
const road=new THREE.Mesh(new THREE.PlaneGeometry(20,700),new THREE.MeshStandardMaterial({color:0x35383c,roughness:.95}));road.rotation.x=-Math.PI/2;road.position.z=160;road.receiveShadow=true;scene.add(road);
const shoulderMat=new THREE.MeshStandardMaterial({color:0x8b806e});const shoulder=new THREE.Mesh(new THREE.PlaneGeometry(50,700),shoulderMat);shoulder.rotation.x=-Math.PI/2;shoulder.position.set(0,-.02,160);scene.add(shoulder); // road overlays center
for(const x of [-9,9]){const c=new THREE.Mesh(new THREE.BoxGeometry(.18,.08,600),new THREE.MeshStandardMaterial({color:0xd5b76a}));c.position.set(x,.04,130);scene.add(c)}
for(let z=-10;z<500;z+=12){for(const x of [-4.5,0,4.5]){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.035,6),new THREE.MeshStandardMaterial({color:0xf2e8c9}));m.position.set(x,.065,z);scene.add(m)}}
// roadside buildings, shops and trees for an Indian-road feel
function box(x,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color});m.position.set(x,h/2,z);m.castShadow=true;scene.add(m);return m}
for(let z=-10;z<420;z+=28){box(-17,z,9,THREE.MathUtils.randFloat(5,11),18,0xbca889);box(17,z+8,8,THREE.MathUtils.randFloat(4,10),15,0xc39b77)}
function tree(x,z){const t=box(x,z,.5,3,.5,0x6b4b2a);const crown=new THREE.Mesh(new THREE.SphereGeometry(2.2,10,8),new THREE.MeshStandardMaterial({color:0x35633a}));crown.position.set(x,5,z);crown.castShadow=true;scene.add(crown)}
for(let z=5;z<400;z+=23){tree(-12,z);if(z%46===0)tree(12,z+5)}
// Extra roadside depth markers
for(let z=0;z<480;z+=20){
  for(const x of [-11.5,11.5]){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,3.2,8),new THREE.MeshStandardMaterial({color:0x4b4b4b}));
    pole.position.set(x,1.6,z); scene.add(pole);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),new THREE.MeshStandardMaterial({color:0xf4d58a,emissive:0x332200}));
    lamp.position.set(x,3.25,z); scene.add(lamp);
  }
}

const ego=new THREE.Group();ego.position.set(0,.55,0);scene.add(ego);function makeVehicle(color=0x1f2937,scale=1){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.9*scale,.55*scale,4.2*scale),new THREE.MeshStandardMaterial({color,metalness:.2,roughness:.55}));body.position.y=.35*scale;body.castShadow=true;g.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55*scale,.55*scale,1.8*scale),new THREE.MeshStandardMaterial({color:0x182431,roughness:.3}));cabin.position.set(0,.85*scale,.1*scale);cabin.castShadow=true;g.add(cabin);for(const sx of [-.95,.95])for(const sz of [-1.25,1.25]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.28*scale,.28*scale,.18*scale,12),new THREE.MeshStandardMaterial({color:0x101010}));w.rotation.z=Math.PI/2;w.position.set(sx,.23*scale,sz);g.add(w)}return g}ego.add(makeVehicle(0x1e5b9c));
let actors=[];let id=1;const types=[['car',1.8,4.2,0x9b2335],['motorcycle',.8,2,0xf59e0b],['autorickshaw',1.4,2.8,0x157f3f],['bus',2.5,10,0x6b4db3],['truck',2.5,7,0x8b5a2b],['person',.6,.6,0xe7c48b],['rolling_object',.8,.8,0xe07a2f]];
function addActor(type,x,z,vx){const t=types.find(a=>a[0]===type)||types[0];let mesh;if(type==='person'){mesh=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.3,.35,1.5,8),new THREE.MeshStandardMaterial({color:t[3]}));b.position.y=.9;mesh.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.25,8,8),new THREE.MeshStandardMaterial({color:0xd8aa82}));h.position.y=1.8;mesh.add(h)}else if(type==='rolling_object'){mesh=new THREE.Mesh(new THREE.SphereGeometry(.45,12,8),new THREE.MeshStandardMaterial({color:t[3]}));mesh.position.y=.45}else mesh=makeVehicle(t[3],t[1]/1.8);mesh.position.set(x,0,z);mesh.castShadow=true;scene.add(mesh);const a={id:id++,type,x,z,vx:vx??THREE.MathUtils.randFloat(3,11),vy:0,mesh,w:t[1],l:t[2],triggered:false};actors.push(a);return a}
function resetWorld(){for(const a of actors)scene.remove(a.mesh);actors=[];id=1;ego.position.set(0,.55,0);ego.rotation.set(0,0,0);ego.userData.speed=7;target=7;for(let i=0;i<65;i++){const kind=['car','car','car','motorcycle','motorcycle','autorickshaw','bus','truck'][Math.floor(Math.random()*8)];addActor(kind,THREE.MathUtils.randFloat(-7.5,7.5),THREE.MathUtils.randFloat(15,280),THREE.MathUtils.randFloat(3,12))}for(let i=0;i<18;i++)addActor('person',Math.random()<.5?-7.5:7.5,THREE.MathUtils.randFloat(20,180),0);addActor('motorcycle',-6,35,8);addActor('rolling_object',5,55,4);addActor('car',2.3,75,2)}
let mode='auto',keys=new Set(),last=performance.now(),target=7; ego.userData.speed=7;
window.setMode=m=>{mode=m;document.getElementById('mode').textContent='MODE: '+m.toUpperCase()};window.resetWorld=resetWorld;window.eventScenario=name=>{let a;if(name==='motorcycle_cut_in')a=actors.find(x=>x.type==='motorcycle');if(name==='pedestrian_emerge')a=actors.find(x=>x.type==='person');if(name==='rolling_object')a=actors.find(x=>x.type==='rolling_object');if(name==='sudden_stop')a=actors.find(x=>x.type==='car');if(a){a.x=0;a.z=ego.position.z+30;a.vx=name==='sudden_stop'?0:Math.max(a.vx,5);a.vy=name==='pedestrian_emerge'?2.5:-3}}
addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});resetWorld();
document.getElementById('speed').textContent=(ego.userData.speed*3.6).toFixed(0)+' km/h';
document.getElementById('target').textContent=(target*3.6).toFixed(0);
function update(dt){let steer=0;if(mode==='manual'){if(keys.has('a')||keys.has('arrowleft'))steer=-1;if(keys.has('d')||keys.has('arrowright'))steer=1;let th=keys.has('w')||keys.has('arrowup')?1:0;let br=keys.has('s')||keys.has('arrowdown')?1:0;target=ego.userData.speed??7;ego.userData.speed=Math.max(0,Math.min(18,target+(5*th-10*br-.2)*dt));}else{const near=actors.filter(a=>a.active!==false&&a.z-ego.position.z>5&&a.z-ego.position.z<45&&Math.abs(a.x-ego.position.x)<2.3);const risk=Math.min(1,near.length*.22);target=near.length?Math.max(0,7-risk*7):8;let lead=near[0];steer=lead?Math.max(-1,Math.min(1,-lead.x/3)):0;ego.userData.speed+=(target-(ego.userData.speed??7))*dt*1.5;}
ego.userData.speed=Math.max(0,Math.min(18,ego.userData.speed??7));ego.rotation.y=THREE.MathUtils.lerp(ego.rotation.y,steer*.22,.12);ego.position.z+=(ego.userData.speed)*dt;ego.position.x+=Math.sin(ego.rotation.y)*ego.userData.speed*dt;ego.position.x=THREE.MathUtils.clamp(ego.position.x,-7.2,7.2);
for(const a of actors){a.z+=a.vx*dt;a.x+=a.vy*dt;if(a.type==='person'&&Math.abs(a.x)>8)a.vy*=-1;if(a.type==='rolling_object')a.mesh.rotation.x+=a.vx*dt;a.mesh.position.x=a.x;a.mesh.position.z=a.z;if(a.z-ego.position.z<-35){a.z=ego.position.z+260+Math.random()*50;a.x=THREE.MathUtils.randFloat(-7,7);a.mesh.position.x=a.x;a.mesh.position.z=a.z}}
const risk=Math.min(1,actors.filter(a=>a.z-ego.position.z>2&&a.z-ego.position.z<35&&Math.abs(a.x-ego.position.x)<2.5).length*.18);document.getElementById('speed').textContent=(ego.userData.speed*3.6).toFixed(0)+' km/h';document.getElementById('target').textContent=(target*3.6).toFixed(0);document.getElementById('risk').textContent=Math.round(risk*100)+'%';document.getElementById('objects').textContent=actors.filter(a=>a.z-ego.position.z>0&&a.z-ego.position.z<100).length;document.getElementById('decisionText').textContent=risk>.7?'EMERGENCY BRAKE':risk>.2?'SLOW / AVOID':'FREE SPACE';document.getElementById('decisionText').className='big '+(risk>.7?'bad':risk>.2?'warn':'ok');
// chase camera
camera.position.x=THREE.MathUtils.lerp(camera.position.x,ego.position.x,Math.min(1,dt*4));camera.position.y=5.5;camera.position.z=ego.position.z-11;camera.lookAt(ego.position.x,1.1,ego.position.z+22);}
function animate(now){
  const dt=Math.min(.05,Math.max(.001,(now-last)/1000)); last=now;
  try { update(dt); renderer.render(scene,camera); }
  catch(err){ console.error(err); document.getElementById('decisionText').textContent='SIM ERROR'; document.getElementById('decisionText').className='big bad'; }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script></body></html>
